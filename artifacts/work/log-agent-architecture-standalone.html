:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;log-agent-architecture&quot;&gt;
  &lt;style&gt;
    #log-agent-architecture {
      color: var(--foreground);
      font-size: var(--font-size-base);
      width: 100%;
    }
    #log-agent-architecture * { box-sizing: border-box; }
    #log-agent-architecture .la-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    #log-agent-architecture .la-head h2 { margin: 0; }
    #log-agent-architecture .la-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    #log-agent-architecture [data-panel][hidden] { display: none; }
    #log-agent-architecture .la-kicker {
      color: var(--muted-foreground);
      margin: 4px 0 0;
    }
    #log-agent-architecture .la-rail {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    #log-agent-architecture .la-rail-block {
      padding: 10px 12px;
      border-left: 3px solid var(--viz-series-1);
      background: color-mix(in srgb, var(--viz-series-1) 8%, transparent);
    }
    #log-agent-architecture .la-rail-block strong { display: block; margin-bottom: 4px; }
    #log-agent-architecture .la-rail-block span { color: var(--muted-foreground); }
    #log-agent-architecture .la-flow {
      display: grid;
      grid-template-columns: minmax(118px, 0.8fr) 28px minmax(130px, 1fr) 28px minmax(140px, 1fr) 28px minmax(130px, 1fr) 28px minmax(130px, 1fr);
      align-items: stretch;
      gap: 6px;
      margin: 14px 0;
    }
    #log-agent-architecture .la-arrow {
      display: grid;
      place-items: center;
      color: var(--muted-foreground);
      font-weight: 500;
    }
    #log-agent-architecture .la-node {
      width: 100%;
      min-height: 68px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
      gap: 4px;
      padding: 10px 12px;
      color: var(--foreground);
      background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    #log-agent-architecture .la-node:hover,
    #log-agent-architecture .la-node[aria-pressed=&quot;true&quot;] {
      background: color-mix(in srgb, var(--accent) 26%, transparent);
      border-color: var(--accent);
    }
    #log-agent-architecture .la-node small { color: var(--muted-foreground); }
    #log-agent-architecture .la-detail {
      min-height: 48px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--foreground);
    }
    #log-agent-architecture .la-detail strong { color: var(--viz-series-1); }
    #log-agent-architecture .la-result {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    #log-agent-architecture .la-result &gt; div {
      padding: 10px 12px;
      border-top: 2px solid var(--viz-series-1);
    }
    #log-agent-architecture .la-result strong { display: block; margin-bottom: 3px; }
    #log-agent-architecture .la-result span { color: var(--muted-foreground); }
    #log-agent-architecture .la-steps {
      display: grid;
      grid-template-columns: repeat(7, minmax(92px, 1fr));
      gap: 8px;
      align-items: start;
      margin-top: 16px;
    }
    #log-agent-architecture .la-step { position: relative; padding-top: 15px; }
    #log-agent-architecture .la-step::before {
      content: &quot;&quot;;
      position: absolute;
      top: 4px;
      left: 0;
      right: -8px;
      height: 2px;
      background: var(--border);
    }
    #log-agent-architecture .la-step:last-child::before { right: 50%; }
    #log-agent-architecture .la-dot {
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--viz-series-1);
    }
    #log-agent-architecture .la-step strong { display: block; margin-bottom: 5px; }
    #log-agent-architecture .la-step span { color: var(--muted-foreground); }
    #log-agent-architecture .la-gates {
      margin-top: 18px;
      padding: 10px 12px;
      background: color-mix(in srgb, var(--accent) 13%, transparent);
      border-left: 3px solid var(--accent);
    }
    #log-agent-architecture .la-phases {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0 18px;
    }
    #log-agent-architecture .la-phase {
      border-top: 3px solid var(--viz-series-1);
      padding-top: 10px;
    }
    #log-agent-architecture .la-phase h3 { margin: 0 0 6px; }
    #log-agent-architecture .la-phase p { margin: 4px 0; color: var(--muted-foreground); }
    #log-agent-architecture .la-phase strong { color: var(--foreground); }
    #log-agent-architecture .la-highlights {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    #log-agent-architecture .la-highlight {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    #log-agent-architecture .la-highlight strong { display: block; margin-bottom: 4px; }
    #log-agent-architecture .la-highlight span { color: var(--muted-foreground); }
    @media (max-width: 760px) {
      #log-agent-architecture .la-flow {
        grid-template-columns: 1fr;
      }
      #log-agent-architecture .la-arrow { transform: rotate(90deg); min-height: 18px; }
      #log-agent-architecture .la-rail,
      #log-agent-architecture .la-result,
      #log-agent-architecture .la-phases,
      #log-agent-architecture .la-highlights { grid-template-columns: 1fr; }
      #log-agent-architecture .la-steps { grid-template-columns: 1fr; }
      #log-agent-architecture .la-step { padding: 0 0 0 20px; }
      #log-agent-architecture .la-step::before {
        top: 0;
        bottom: -8px;
        left: 4px;
        right: auto;
        width: 2px;
        height: auto;
      }
      #log-agent-architecture .la-step:last-child::before { bottom: 50%; right: auto; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;la-head&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;SLS 日志 Agent：从查询工具到可信调查系统&lt;/h2&gt;
      &lt;p class=&quot;la-kicker&quot;&gt;模型负责理解、规划和解释；程序负责权限、查询、计算和审计。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;la-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;日志 Agent 架构视图&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;la-panel-architecture&quot; data-tab=&quot;architecture&quot;&gt;总体架构&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;la-panel-flow&quot; data-tab=&quot;flow&quot;&gt;调查主链路&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;la-panel-roadmap&quot; data-tab=&quot;roadmap&quot;&gt;开发路线与亮点&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;section id=&quot;la-panel-architecture&quot; data-panel=&quot;architecture&quot; role=&quot;tabpanel&quot;&gt;
    &lt;div class=&quot;la-rail&quot; aria-label=&quot;三条横向能力轨道&quot;&gt;
      &lt;div class=&quot;la-rail-block&quot;&gt;&lt;strong&gt;知识轨&lt;/strong&gt;&lt;span&gt;资源目录、字段字典、服务拓扑、Runbook、发布与历史事故&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-rail-block&quot;&gt;&lt;strong&gt;治理轨&lt;/strong&gt;&lt;span&gt;RAM / STS、字段脱敏、查询预算、审批、幂等与审计&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-rail-block&quot;&gt;&lt;strong&gt;证据轨&lt;/strong&gt;&lt;span&gt;查询、时间窗、完整性、样本、扫描量、结果哈希与置信度&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;la-flow&quot; aria-label=&quot;日志 Agent 核心模块流向&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;la-node&quot; data-module=&quot;trigger&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;入口与触发&lt;/strong&gt;&lt;small&gt;问答 / 告警 / 消费组&lt;/small&gt;&lt;/button&gt;
      &lt;div class=&quot;la-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;la-node&quot; data-module=&quot;session&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;调查会话&lt;/strong&gt;&lt;small&gt;身份、范围、状态恢复&lt;/small&gt;&lt;/button&gt;
      &lt;div class=&quot;la-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;la-node&quot; data-module=&quot;orchestrator&quot; aria-pressed=&quot;true&quot;&gt;&lt;strong&gt;Agent 编排器&lt;/strong&gt;&lt;small&gt;计划、假设、验证、停止&lt;/small&gt;&lt;/button&gt;
      &lt;div class=&quot;la-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;la-node&quot; data-module=&quot;gateway&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;确定性工具网关&lt;/strong&gt;&lt;small&gt;Schema 校验、编译、限流&lt;/small&gt;&lt;/button&gt;
      &lt;div class=&quot;la-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;la-node&quot; data-module=&quot;sources&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;数据与系统&lt;/strong&gt;&lt;small&gt;SLS / Trace / CMDB / 发布&lt;/small&gt;&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;la-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;Agent 编排器：&lt;/strong&gt;&lt;span data-detail&gt;用显式状态机管理 SCOPE → DISCOVER → BASELINE → DRILLDOWN → CORRELATE → VERIFY → REPORT，并设置查询次数、时间、成本和停止条件。&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;la-result&quot; aria-label=&quot;系统输出&quot;&gt;
      &lt;div&gt;&lt;strong&gt;事实&lt;/strong&gt;&lt;span&gt;由完整查询或确定性计算直接支持&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;推断&lt;/strong&gt;&lt;span&gt;附支持证据、反证与置信度&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;建议动作&lt;/strong&gt;&lt;span&gt;预览风险；写操作审批后执行并验证&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;la-panel-flow&quot; data-panel=&quot;flow&quot; role=&quot;tabpanel&quot; hidden&gt;
    &lt;div class=&quot;la-steps&quot; aria-label=&quot;一次故障调查的七个步骤&quot;&gt;
      &lt;div class=&quot;la-step&quot;&gt;&lt;i class=&quot;la-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;1. 定界&lt;/strong&gt;&lt;span&gt;确认服务、环境、时间窗与访问范围&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-step&quot;&gt;&lt;i class=&quot;la-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;2. 发现&lt;/strong&gt;&lt;span&gt;读取 Project、LogStore、索引与字段类型&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-step&quot;&gt;&lt;i class=&quot;la-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;3. 基线&lt;/strong&gt;&lt;span&gt;判断是否真异常并定位拐点&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-step&quot;&gt;&lt;i class=&quot;la-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;4. 下钻&lt;/strong&gt;&lt;span&gt;按版本、Pod、错误码、接口找贡献维度&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-step&quot;&gt;&lt;i class=&quot;la-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;5. 关联&lt;/strong&gt;&lt;span&gt;串联上下文、Trace、发布与配置变更&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-step&quot;&gt;&lt;i class=&quot;la-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;6. 验证&lt;/strong&gt;&lt;span&gt;比较正常组并主动寻找反证&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-step&quot;&gt;&lt;i class=&quot;la-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;7. 报告&lt;/strong&gt;&lt;span&gt;结论、证据、缺口、建议与复跑入口&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;la-gates&quot;&gt;&lt;strong&gt;硬门槛：&lt;/strong&gt;结果不完整、字段不存在、时间窗过大、权限不足或证据冲突时，Agent 必须缩窗、换策略、降置信度或请人确认，不能直接下根因结论。&lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;la-panel-roadmap&quot; data-panel=&quot;roadmap&quot; role=&quot;tabpanel&quot; hidden&gt;
    &lt;div class=&quot;la-phases&quot; aria-label=&quot;六周最小可用版本路线&quot;&gt;
      &lt;div class=&quot;la-phase&quot;&gt;&lt;h3&gt;第 1 周&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;底座：&lt;/strong&gt;字段规范、资源目录、RAM / STS、历史事故样本&lt;/p&gt;&lt;p&gt;退出条件：能准确解析服务到 LogStore&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;la-phase&quot;&gt;&lt;h3&gt;第 2 周&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;工具：&lt;/strong&gt;复用官方 Query Skill / MCP，增加 QuerySpec 校验网关&lt;/p&gt;&lt;p&gt;退出条件：所有查询只读、限时、限量、可审计&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;la-phase&quot;&gt;&lt;h3&gt;第 3–4 周&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;诊断：&lt;/strong&gt;四类固定工作流、基线对比、证据引用、模型报告&lt;/p&gt;&lt;p&gt;退出条件：历史事故 Top-3 候选可评测&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;la-phase&quot;&gt;&lt;h3&gt;第 5–6 周&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;上线：&lt;/strong&gt;越权与注入测试、失败恢复、只读灰度、反馈闭环&lt;/p&gt;&lt;p&gt;退出条件：无越权、无无证据强结论&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;la-highlights&quot; aria-label=&quot;优先亮点&quot;&gt;
      &lt;div class=&quot;la-highlight&quot;&gt;&lt;strong&gt;证据链回答&lt;/strong&gt;&lt;span&gt;指标：关键结论证据覆盖率 100%，支持一键复跑&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-highlight&quot;&gt;&lt;strong&gt;Schema-aware 查询编译器&lt;/strong&gt;&lt;span&gt;指标：字段幻觉拦截率、查询一次成功率、扫描量下降&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-highlight&quot;&gt;&lt;strong&gt;发布前后 + 对照组验证&lt;/strong&gt;&lt;span&gt;指标：Top-3 根因命中率、错误归因率、MTTI&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;la-highlight&quot;&gt;&lt;strong&gt;日志质量医生&lt;/strong&gt;&lt;span&gt;指标：缺失 Trace ID、字段漂移、未建索引问题关闭率&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;log-agent-architecture&#x27;);
      if (!root) return;

      const details = {
        trigger: &#x27;接收研发问答、SLS 告警 Webhook 或 ConsumerGroup 秒级事件；入口只做认证、限流和标准化，不直接访问 SLS。&#x27;,
        session: &#x27;保存问题、访问上下文、调查计划、检查点和预算；任务中断后可恢复，重复触发可按事故指纹合并。&#x27;,
        orchestrator: &#x27;用显式状态机管理 SCOPE → DISCOVER → BASELINE → DRILLDOWN → CORRELATE → VERIFY → REPORT，并设置查询次数、时间、成本和停止条件。&#x27;,
        gateway: &#x27;模型只提交结构化 QuerySpec；网关读取索引、校验字段与权限、编译 SLS 查询、执行分页/重试，并标注 Complete 或 Incomplete。&#x27;,
        sources: &#x27;SLS 提供日志主证据；Trace、指标、发布、配置、K8s 和 CMDB 用于建立时间线、影响面与候选根因，不把时间相关直接当成因果。&#x27;
      };

      const tabs = Array.from(root.querySelectorAll(&#x27;[data-tab]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;[data-panel]&#x27;));
      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; {
          const selected = tab.getAttribute(&#x27;data-tab&#x27;);
          tabs.forEach((item) =&gt; {
            const active = item === tab;
            item.setAttribute(&#x27;aria-selected&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
            item.classList.toggle(&#x27;btn-primary&#x27;, active);
          });
          panels.forEach((panel) =&gt; {
            panel.hidden = panel.getAttribute(&#x27;data-panel&#x27;) !== selected;
          });
        });
      });

      const moduleButtons = Array.from(root.querySelectorAll(&#x27;[data-module]&#x27;));
      const detail = root.querySelector(&#x27;[data-detail]&#x27;);
      moduleButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const key = button.getAttribute(&#x27;data-module&#x27;);
          moduleButtons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, item === button ? &#x27;true&#x27; : &#x27;false&#x27;));
          if (detail &amp;&amp; key &amp;&amp; details[key]) detail.textContent = details[key];
          const strong = detail ? detail.previousElementSibling : null;
          if (strong) strong.textContent = `${button.querySelector(&#x27;strong&#x27;)?.textContent || &#x27;模块&#x27;}：`;
        });
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
